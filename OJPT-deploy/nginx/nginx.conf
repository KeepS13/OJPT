worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  localhost ojptdevtest7x9k2mn8p3q.com;

        root   html;                  # 前端 dist 已放在 html
        index  index.html;

        # 头像等静态文件服务（直接由 nginx 返回，不经过后端，必须放在 location / 之前）
        location /uploads/ {
            alias "C:/Program Files/nginx-1.28.0/uploads/";
            expires 30d;  # 缓存 30 天
            add_header Cache-Control "public, immutable";
            # 允许跨域（如果需要）
            add_header Access-Control-Allow-Origin "*" always;
            # 文件不存在时返回 404，不要回退到前端
            try_files $uri =404;
        }

        # 前端静态资源
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 代理
        location /api/ {
            proxy_pass http://localhost:8111;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 允许前端 dev 端口（8110）跨域访问
            add_header Access-Control-Allow-Origin "http://localhost:8110" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

            # 处理预检请求
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root html; }
    }
}
