name: ojpt

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ojpt}
      MYSQL_USER: ${MYSQL_APP_USER:-ojpt}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: OJPT-deploy/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8111
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ojpt}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USER:-ojpt}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      OJPT_JWT_SECRET: ${OJPT_JWT_SECRET}
      OJPT_JWT_ACCESS_EXP_SECONDS: ${OJPT_JWT_ACCESS_EXP_SECONDS:-1800}
      OJPT_JWT_REFRESH_EXP_SECONDS: ${OJPT_JWT_REFRESH_EXP_SECONDS:-604800}
      OJPT_JWT_ISSUER: ${OJPT_JWT_ISSUER:-ojpt}
      OJPT_UPLOAD_BASE_PATH: /app/uploads
      OJPT_UPLOAD_AVATAR_PATH: avatars
      OJPT_UPLOAD_AVATAR_URL_PREFIX: /uploads/avatars
      OJPT_JUDGE_DOCKER_EXECUTABLE: ${OJPT_JUDGE_DOCKER_EXECUTABLE:-docker}
      OJPT_JUDGE_CPP_IMAGE: ${OJPT_JUDGE_CPP_IMAGE:-gcc:13.2.0}
      OJPT_JUDGE_JAVA_IMAGE: ${OJPT_JUDGE_JAVA_IMAGE:-eclipse-temurin:17-jdk}
      OJPT_JUDGE_PYTHON_IMAGE: ${OJPT_JUDGE_PYTHON_IMAGE:-python:3.11}
      OJPT_JUDGE_CPU: ${OJPT_JUDGE_CPU:-1}
      OJPT_JUDGE_MEMORY_MB: ${OJPT_JUDGE_MEMORY_MB:-256}
      OJPT_JUDGE_HEALTH_TIMEOUT_MS: ${OJPT_JUDGE_HEALTH_TIMEOUT_MS:-3000}
    ports:
      - "${BACKEND_PORT:-8111}:8111"
    volumes:
      - uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: .
      dockerfile: OJPT-deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro

volumes:
  mysql_data:
  redis_data:
  uploads_data:
