const NS = "http://www.w3.org/2000/svg";

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[ch]));
}

function tspans(text, x, y, lineHeight = 16, cls = "txt") {
  const lines = String(text).split("\n");
  const start = y - ((lines.length - 1) * lineHeight) / 2;
  return `<text class="${cls}" x="${x}" y="${start}">${lines.map((line, i) =>
    `<tspan x="${x}" dy="${i === 0 ? 0 : lineHeight}">${esc(line)}</tspan>`
  ).join("")}</text>`;
}

function svg(w, h, inner) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="${NS}">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L9,3.5 L0,7 Z" fill="#111"></path>
      </marker>
    </defs>
    ${inner}
  </svg>`;
}

function box(x, y, w, h, text, cls = "box", textCls = "txt") {
  return `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}"></rect>${tspans(text, x + w / 2, y + h / 2, 16, textCls)}`;
}

function roundBox(x, y, w, h, text, textCls = "txt") {
  return `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(18, h / 2)}" ry="${Math.min(18, h / 2)}"></rect>${tspans(text, x + w / 2, y + h / 2, 16, textCls)}`;
}

function ellipse(x, y, w, h, text, textCls = "txt") {
  return `<ellipse class="ellipse" cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}"></ellipse>${tspans(text, x + w / 2, y + h / 2, 16, textCls)}`;
}

function underlinedEllipse(x, y, w, h, text, textCls = "txt", underlineOffset = 9, textScale = 10.5, inset = 22) {
  const cx = x + w / 2;
  const cy = y + h / 2;
  const textW = Math.min(w - inset, Math.max(28, String(text).length * textScale));
  const underlineY = cy + underlineOffset;
  return `${ellipse(x, y, w, h, text, textCls)}<line class="line thin" x1="${cx - textW / 2}" y1="${underlineY}" x2="${cx + textW / 2}" y2="${underlineY}"></line>`;
}

function circle(cx, cy, r, text, textCls = "txt") {
  return `<circle class="process" cx="${cx}" cy="${cy}" r="${r}"></circle>${tspans(text, cx, cy, 15, textCls)}`;
}

function diamond(cx, cy, w, h, text, textCls = "txt") {
  const pts = `${cx},${cy - h / 2} ${cx + w / 2},${cy} ${cx},${cy + h / 2} ${cx - w / 2},${cy}`;
  return `<polygon class="diamond" points="${pts}"></polygon>${tspans(text, cx, cy, 15, textCls)}`;
}

function line(x1, y1, x2, y2, arrow = false) {
  return `<line class="line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${arrow ? 'marker-end="url(#arrow)"' : ""}></line>`;
}

function poly(points, arrow = true) {
  return `<polyline class="line" points="${points.map((p) => p.join(",")).join(" ")}" ${arrow ? 'marker-end="url(#arrow)"' : ""}></polyline>`;
}

function label(x, y, text, cls = "txt small") {
  return tspans(text, x, y, 14, cls);
}

function store(x, y, w, h, code, name) {
  return `${line(x, y, x + w, y)}${line(x, y + h, x + w, y + h)}${tspans(`${code}\n${name}`, x + w / 2, y + h / 2, 15, "txt small")}`;
}

function entityFigure(id) {
  const [name, attrs] = entityData[id];
  const primaryKey = primaryKeyData[id];
  const dense = attrs.length > 8;
  const w = dense ? 720 : 620;
  const h = dense ? 470 : 360;
  const cx = w / 2, cy = h / 2;
  const rx = dense ? 285 : 235;
  const ry = dense ? 185 : 145;
  const centerW = Math.max(130, name.length * 18 + 42);
  let connectors = "";
  let ovals = "";
  attrs.forEach((attr, i) => {
    const angle = -Math.PI / 2 + (i * Math.PI * 2) / attrs.length;
    const x = cx + Math.cos(angle) * rx;
    const y = cy + Math.sin(angle) * ry;
    const ew = Math.max(82, attr.length * 15 + 24);
    const eh = 42;
    connectors += line(cx, cy, x, y);
    ovals += attr === primaryKey
      ? underlinedEllipse(x - ew / 2, y - eh / 2, ew, eh, attr, "txt small")
      : ellipse(x - ew / 2, y - eh / 2, ew, eh, attr, "txt small");
  });
  return svg(w, h, connectors + ovals + box(cx - centerW / 2, cy - 26, centerW, 52, name, "box", "txt bold"));
}

function erOverview() {
  let links = "";
  let nodes = "";
  const graph = {};
  const erPrimaryKeys = {
    draft: "草稿ID",
    problem: "题目ID",
    case: "用例ID",
    profile: "资料ID",
    user: "用户ID",
    submission: "提交ID",
    tag: "标签ID",
    reset: "申请ID",
    progress: "进度ID",
    caseResult: "结果ID"
  };

  function rectPort(cx, cy, w, h, tx, ty) {
    const dx = tx - cx;
    const dy = ty - cy;
    const scale = Math.max(Math.abs(dx) / (w / 2), Math.abs(dy) / (h / 2), 1);
    return [cx + dx / scale, cy + dy / scale];
  }

  function diamondPort(cx, cy, w, h, tx, ty) {
    const dx = tx - cx;
    const dy = ty - cy;
    const scale = Math.abs(dx) / (w / 2) + Math.abs(dy) / (h / 2);
    return scale ? [cx + dx / scale, cy + dy / scale] : [cx, cy];
  }

  function nodePort(node, target) {
    if (node.kind === "rel") return diamondPort(node.cx, node.cy, node.w, node.h, target.cx, target.cy);
    return rectPort(node.cx, node.cy, node.w, node.h, target.cx, target.cy);
  }

  function attrEntity(key, cx, cy, w, h, name, attrs) {
    graph[key] = { kind: "entity", cx, cy, w, h };
    const primaryKey = erPrimaryKeys[key];
    attrs.forEach(([ax, ay, text]) => {
      const ew = Math.max(44, text.length * 10 + 16);
      const [sx, sy] = rectPort(cx, cy, w, h, ax, ay);
      links += line(sx, sy, ax, ay);
      nodes += text === primaryKey
        ? underlinedEllipse(ax - ew / 2, ay - 12, ew, 24, text, "txt tiny", 6.2, 9.2, 18)
        : ellipse(ax - ew / 2, ay - 12, ew, 24, text, "txt tiny");
    });
    nodes += box(cx - w / 2, cy - h / 2, w, h, name, "box", "txt small bold");
  }

  function rel(key, cx, cy, text, w = 60, h = 36) {
    graph[key] = { kind: "rel", cx, cy, w, h };
    nodes += diamond(cx, cy, w, h, text, "txt tiny");
  }

  function connect(aKey, bKey, card, t = 0.28, dx = 0, dy = 0) {
    const a = graph[aKey];
    const b = graph[bKey];
    const [x1, y1] = nodePort(a, b);
    const [x2, y2] = nodePort(b, a);
    links += line(x1, y1, x2, y2);

  const branchEndW = 76;
  const w = branchEndX + branchEndW + 28;

  let shapes = "";

  function nodeInfo(node, i) {
    const text = node.text;
    const cy = top + i * rowGap;
    const isTerminal = node.type === "terminal";
    const isDecision = node.type === "decision";
    const processW = node.w || 170;
    const processH = node.h || 44;
    const bounds = isTerminal
      ? { left: cx - 45, right: cx + 45, top: cy - 17, bottom: cy + 17, cx, cy, w: 90, h: 34 }
      : isDecision
        ? { left: cx - 68, right: cx + 68, top: cy - 31, bottom: cy + 31, cx, cy, w: 136, h: 62 }

  }

    else shapes += box(node.left, node.top, node.w, node.h, node.text, "box", "txt small");
  });

  for (let i = 0; i < layout.length - 1; i++) {
    const cur = layout[i];
    const next = layout[i + 1];

    if (cur.nextLabel) connectors += label(cur.cx + 32, (cur.bottom + next.top) / 2, cur.nextLabel, "txt tiny");
  }

  const failNodes = layout.filter((node) => node.fail);
  failNodes.forEach((node) => {
    const branchY = node.cy;
    connectors += line(node.right, branchY, branchX, branchY, true);
    connectors += label((node.right + branchX) / 2, branchY - 16, node.failLabel || "否", "txt tiny");
    shapes += box(branchX, branchY - 22, branchW, 44, node.fail, "box", "txt small");
    connectors += line(branchX + branchW, branchY, branchEndX, branchY, true);
    shapes += roundBox(branchEndX, branchY - 17, branchEndW, 34, "结束", "txt small");
  });

  return svg(w, h, shapes + connectors);
}

      { text: "进入管理端\n路由" },
      { text: "路由守卫\n校验登录" },
      { text: "具备管理员\n角色", type: "decision", nextLabel: "具备", failLabel: "不足", fail: "跳回首页\n提示无权" },
      { text: "读取当前\n子路由" },
      { text: "匹配侧边\n菜单" },
      { text: "匹配成功", type: "decision", nextLabel: "成功", failLabel: "失败", fail: "默认管理\n控制台" },
      { text: "高亮菜单\n更新标题" },
      { text: "渲染对应\n子页面" },
      { text: "结束", type: "terminal" },
    ],
  },
};

function flowFigure(kind) {
  const config = flowDefinitions[kind];
  if (!config) {
    return svg(320, 120, box(45, 38, 230, 44, "未定义流程图", "box", "txt small"));
  }

  const nodes = config.nodes;
  const rowGap = config.rowGap || 82;
  const top = config.top || 40;
  const cx = config.cx || 250;
  const branchX = config.branchX || 455;
  const branchW = config.branchW || 150;
  const branchEndX = branchX + branchW + 26;
  const branchEndW = config.branchEndW || 76;
  const w = branchEndX + branchEndW + 34;
  const h = top + (nodes.length - 1) * rowGap + 58;
  let connectors = "";
  let shapes = "";

  function nodeInfo(node, i) {
    const cy = top + i * rowGap;
    const isTerminal = node.type === "terminal";
    const isDecision = node.type === "decision";
    const processW = node.w || 170;
    const processH = node.h || 44;
    if (isTerminal) {
      const tw = node.w || 92;
      const th = node.h || 34;
      return { ...node, isTerminal, isDecision, cx, cy, left: cx - tw / 2, right: cx + tw / 2, top: cy - th / 2, bottom: cy + th / 2, w: tw, h: th };
    }
    if (isDecision) {
      const dw = node.w || 122;
      const dh = node.h || 62;
      return { ...node, isTerminal, isDecision, cx, cy, left: cx - dw / 2, right: cx + dw / 2, top: cy - dh / 2, bottom: cy + dh / 2, w: dw, h: dh };
    }
    return { ...node, isTerminal, isDecision, cx, cy, left: cx - processW / 2, right: cx + processW / 2, top: cy - processH / 2, bottom: cy + processH / 2, w: processW, h: processH };
  }

  const layout = nodes.map((node, i) => nodeInfo(node, i));
  layout.forEach((node) => {
    if (node.isTerminal) shapes += roundBox(node.left, node.top, node.w, node.h, node.text, "txt small");
    else if (node.isDecision) shapes += diamond(node.cx, node.cy, node.w, node.h, node.text, "txt tiny");
    else shapes += box(node.left, node.top, node.w, node.h, node.text, "box", "txt small");
  });

  for (let i = 0; i < layout.length - 1; i++) {
    const cur = layout[i];
    const next = layout[i + 1];
    connectors += line(cur.cx, cur.bottom, next.cx, next.top, true);
    if (cur.nextLabel) connectors += label(cur.cx + 34, (cur.bottom + next.top) / 2, cur.nextLabel, "txt tiny");
  }

  layout.filter((node) => node.fail).forEach((node) => {
    const branchY = node.cy;
    connectors += line(node.right, branchY, branchX, branchY, true);
    connectors += label((node.right + branchX) / 2, branchY - 16, node.failLabel || "否", "txt tiny");
    shapes += box(branchX, branchY - 22, branchW, 44, node.fail, "box", "txt small");
    connectors += line(branchX + branchW, branchY, branchEndX, branchY, true);
    shapes += roundBox(branchEndX, branchY - 17, branchEndW, 34, "结束", "txt small");
  });

  return svg(w, h, shapes + connectors);
}

const flowRenderers = Object.fromEntries(
  Object.keys(flowDefinitions).map((id) => [id, () => flowFigure(id)])
);

const renderers = {
  "fig-3-1-function-modules": functionModules,
  "fig-3-2-top-dfd": topDfd,
  "fig-3-3-zero-dfd": zeroDfd,
  "fig-3-4-level1-judge-dfd": level1Dfd,
  "fig-4-1-architecture": architecture,
  "fig-4-2-deployment": deployment,
  "fig-4-3-user-entity": () => entityFigure("fig-4-3-user-entity"),
  "fig-4-4-problem-entity": () => entityFigure("fig-4-4-problem-entity"),
  "fig-4-5-tag-entity": () => entityFigure("fig-4-5-tag-entity"),
  "fig-4-6-testcase-entity": () => entityFigure("fig-4-6-testcase-entity"),
  "fig-4-7-code-draft-entity": () => entityFigure("fig-4-7-code-draft-entity"),
  "fig-4-8-submission-entity": () => entityFigure("fig-4-8-submission-entity"),
  "fig-4-9-submission-case-result-entity": () => entityFigure("fig-4-9-submission-case-result-entity"),
  "fig-4-10-user-problem-progress-entity": () => entityFigure("fig-4-10-user-problem-progress-entity"),
  "fig-4-11-er-overview": erOverview,
  "fig-4-12-jwt-auth-flow": () => flowFigure("fig-4-12-jwt-auth-flow"),
  "fig-5-1-login-flow": () => flowFigure("fig-5-1-login-flow"),
  "fig-5-2-problem-filter-flow": () => flowFigure("fig-5-2-problem-filter-flow"),
  "fig-5-3-code-draft-flow": () => flowFigure("fig-5-3-code-draft-flow"),
  "fig-5-4-code-run-flow": () => flowFigure("fig-5-4-code-run-flow"),
  "fig-5-5-submit-async-judge-flow": () => flowFigure("fig-5-5-submit-async-judge-flow"),
  "fig-5-6-admin-problem-flow": () => flowFigure("fig-5-6-admin-problem-flow"),
  ...flowRenderers,
};

document.querySelector("#app").innerHTML = Object.entries(renderers).map(([id, fn]) =>
  `<section class="diagram" id="${id}">${fn()}</section>`
).join("");
</script>
