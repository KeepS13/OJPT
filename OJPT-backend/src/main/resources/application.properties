spring.application.name=OJPT

# 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/ojpt?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway 配置（启用数据库版本管理）
spring.flyway.enabled=true
# 指定迁移脚本所在位置
spring.flyway.locations=classpath:db/migration
# 默认不创建基线，确保全新库能从 V1 开始执行
spring.flyway.baseline-on-migrate=false
# 自定义 Flyway 元数据表名，记录迁移历史
spring.flyway.table=flyway_schema_history

# Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 如果 Redis 设置了密码，取消下面的注释并填入密码
# spring.data.redis.password=your_password
spring.data.redis.database=0
# 连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=500ms
# 连接超时时间
spring.data.redis.timeout=2000ms

# JWT 配置
ojpt.jwt.secret=t3d6d7f9y1f4z6b7x4q0d8b8y1j7j2x4i7c8k0u9a3c0k9x4v8v3f5b0j9z7e2y5
ojpt.jwt.access-exp-seconds=1800
ojpt.jwt.refresh-exp-seconds=604800
ojpt.jwt.issuer=ojpt
ojpt.jwt.redis-prefix=auth:rt:

# 文件上传配置
# 本地存储路径（与 nginx 配置的 alias 路径一致）
ojpt.upload.base-path=C:/Program Files/nginx-1.28.0/uploads
ojpt.upload.avatar-path=avatars
# 文件大小限制（10MB）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# 头像访问 URL 前缀（前端通过此 URL 访问头像）
ojpt.upload.avatar-url-prefix=/uploads/avatars

# 开发体验相关配置（热重启 / LiveReload）
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
